<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stays · TripNest</title>
  <meta name="description" content="Compare indicative nightly rates in Ghana cedis across hotels, hostels, and apartments." />
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body data-page="stays">
  <a href="#main" class="skip-link">Skip to content</a>
  <div id="site-header"></div>

  <main id="main">
    <header class="page-header">
      <div class="shell page-header-inner">
        <p class="eyebrow">Places to stay</p>
        <h1 class="display-lg">Stays across Ghana</h1>
        <p class="lede">
          Indicative nightly rates in Ghana cedis across hotels, hostels, and apartments. Contact providers directly — zero platform commissions.
        </p>
      </div>
    </header>

    <section class="section-sm">
      <div class="shell">
        <div class="filter-bar cols-4">
          <div>
            <label class="field-label" for="stay-q">Search</label>
            <input id="stay-q" type="search" class="field" placeholder="Name, area, or amenity…" />
          </div>
          <div>
            <label class="field-label" for="stay-dest">Destination</label>
            <select id="stay-dest" class="field"></select>
          </div>
          <div>
            <label class="field-label" for="stay-max">Max price / night</label>
            <select id="stay-max" class="field">
              <option value="">Any price</option>
              <option value="250">Up to GH₵ 250</option>
              <option value="500">Up to GH₵ 500</option>
              <option value="800">Up to GH₵ 800</option>
              <option value="1200">Up to GH₵ 1,200</option>
            </select>
          </div>
          <div>
            <label class="field-label" for="stay-sort">Sort</label>
            <select id="stay-sort" class="field">
              <option value="price_asc">Price: Low to High</option>
              <option value="price_desc">Price: High to Low</option>
            </select>
          </div>
        </div>

        <div id="stay-type-pills" class="filter-pills"></div>

        <div class="results-meta">
          <div id="stay-results-meta"></div>
          <button type="button" id="stay-clear" class="btn btn-outline btn-xs">Clear filters</button>
        </div>

        <div id="stay-grid" class="grid-3"></div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/catalog.js"></script>
</body>
</html>
